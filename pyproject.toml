[project]
name = "harvest"
version = "0.1.0"
description = "Personal Japanese immersion learning app — P1 reading pipeline"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<1",
  "jinja2>=3.1,<4",
  "janome>=0.5,<1",
  "mutagen>=1.47,<2",
  "oss2>=2.19,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "trafilatura>=2.0,<3",
  "yt-dlp>=2026.7,<2027",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=15,<16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
voice = [
  "demucs>=4.1,<5",
  "numpy>=2,<3",
]
furigana = [
  "janome>=0.5,<1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
  "integration: requires a local PostgreSQL database supplied through HARVEST_TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
